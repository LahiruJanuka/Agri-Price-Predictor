name: Daily CBSL Price Scraper & Sync

on:
  schedule:
    # Runs daily at 11:30 UTC (5:00 PM Sri Lanka Time)
    # This executes right after CBSL typically publishes their daily reports
    - cron: '30 11 * * *'
  workflow_dispatch: # Allows manually trigger it from GitHub anytime for testing

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      AZURE_STORAGE_CONTAINER_NAME: agri-data
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      # 1. Pull down your repository files onto the GitHub runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up a secure Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up execution by caching installed libraries

      # 3. Install required libraries from root requirements file
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Run python scraping pipeline orchestration script
      - name: Run Data Pipeline (restore DB → ingest → sync → persist)
        run: python -c "from src.data_pipeline import run_full_pipeline_with_storage; run_full_pipeline_with_storage()"